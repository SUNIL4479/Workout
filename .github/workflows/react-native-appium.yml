name: React Native Appium Mobile E2E Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  appium-android-e2e:
    name: Appium React Native Android Test Execution
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (v20.x)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK & Emulator Caching
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Pixel_6
          script: |
            npm install -g appium
            appium driver install uiautomator2
            cd appium-tests && npm install && npm test || true

      - name: 📊 Upload Appium Test Artifacts (Excel, HTML, Logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          path: |
            appium-tests/reports/
            appium-tests/logs/
            appium-tests/screenshots/
          retention-days: 7
