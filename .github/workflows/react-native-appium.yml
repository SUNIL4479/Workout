name: React Native Appium Mobile E2E Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  appium-android-e2e:
    name: Appium React Native Android Test Execution
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (v20.x)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Root & Appium Dependencies
        run: |
          npm ci || npm install
          cd appium-tests && npm install

      - name: 🤖 Execute Smart AI Widget Discovery
        run: |
          cd appium-tests && npm run test:ai

      - name: 🧪 Execute Appium Mobile E2E Test Suite
        run: |
          cd appium-tests && npm test

      - name: 📊 Upload Appium Test Artifacts (Excel, HTML, Logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          path: |
            appium-tests/reports/
            appium-tests/logs/
          retention-days: 7
