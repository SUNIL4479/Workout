name: Grafana k6 API Load Testing Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  k6-load-test:
    name: Execute k6 API Performance & SLA Load Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js (v20.x)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📦 Install Application Dependencies & Build Backend
        run: |
          npm ci || npm install
          npm run build

      - name: 🚀 Start Local Backend Server in Background
        env:
          PORT: 5000
          SESSION_SECRET: 'ci-secret-key-123456789'
        run: |
          npm run dev:backend &
          npx wait-on http://localhost:5000/api/health --timeout 30000 || true

      - name: 🛠️ Install Grafana k6 Load Testing Engine
        run: |
          sudo mkdir -p /usr/share/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: 🧪 Execute 100 Virtual Users Baseline Load Test
        run: |
          k6 run --out json=load-tests/results.json load-tests/load_test_scenario.js

      - name: 📊 Upload k6 Performance & Load Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-results
          path: |
            load-tests/results.json
            Baseline_Load_Test_Results_100VUs_1Min.xlsx
          retention-days: 7
